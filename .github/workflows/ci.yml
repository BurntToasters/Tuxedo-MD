name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24.16.0'
  NPM_VERSION: '12'
  RUST_VERSION: '1.97.1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run test:all
      - run: npm run validate:updater

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features mas
